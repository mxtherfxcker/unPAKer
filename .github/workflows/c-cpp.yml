name: C/C++ CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  format-check:
    name: Check clang-format
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"
        sudo apt-get update
        sudo apt-get install -y clang-format-17
    
    - name: Check formatting
      run: |
        find src include -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | \
          xargs clang-format-17 --dry-run --Werror

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: format-check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: unPAKer-windows
        path: build/Release/unPAKer.exe
        if-no-files-found: warn

  build-linux:
    name: Build Core (Linux)
    runs-on: ubuntu-latest
    needs: format-check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake g++
    
    - name: Configure CMake (core only)
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_CORE_ONLY=ON
    
    - name: Build
      run: cmake --build build --config Release
